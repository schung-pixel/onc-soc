name: collect
on:
  schedule:
    - cron: '23 18 * * *'   # 매일 03:23 KST
  workflow_dispatch:
  push:
    paths: ['.github/workflows/collect.yml', 'collect/**']
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 수집
        run: |
          set -e
          git clone -q --depth 1 -b data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/pub 2>/dev/null || { mkdir /tmp/pub; git -C /tmp/pub init -q -b data; git -C /tmp/pub remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          cp /tmp/pub/*.json collect/ 2>/dev/null || true
          grep -o 'NCT[0-9]\{8\}' index.html | sort -u > collect/nct_list.txt
          : > collect/run.log
          for s in ct_diff nccn_ver; do
            echo "== $s" >> collect/run.log
            python3 collect/$s.py >> collect/run.log 2>&1 || echo "$s 실패" >> collect/run.log
          done
          cat collect/run.log
      - name: 데이터 브랜치에 기록
        run: |
          set -e
          cd /tmp/pub
          git config user.name "collect-bot"; git config user.email "bot@users.noreply.github.com"
          for f in ct_snapshot ct_changes nccn_versions; do cp $GITHUB_WORKSPACE/collect/$f.json . 2>/dev/null || true; done
          cp $GITHUB_WORKSPACE/collect/run.log .
          git add -A && git commit -qm "collect $(date -u +%F)" || exit 0
          git pull -q --rebase origin data 2>/dev/null || true
          git push origin data
